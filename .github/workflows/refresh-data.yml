name: refresh-data

# Weekly rebuild of the site's data so GitHub Pages stays current:
#   download IMDb -> transform with Malloy -> export parquet -> resolve posters
#   -> commit docs/. The dashboards are static HTML that fetch these parquet
#   files client-side, so committing fresh data is all it takes to update the
#   live site -- no re-bundle needed.
#
# History grows ~12 MB/week. That is not part of the weekly recipe; flatten it
# occasionally by hand when it bothers you (see RECIPE.md).

on:
  schedule:
    - cron: "0 6 * * 0"   # weekly, Sunday 06:00 UTC
  workflow_dispatch:       # ...or run on demand from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Malloy CLI
        run: npm install -g @malloydata/cli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DuckDB CLI
        env:
          DUCKDB_VERSION: v1.5.5
        run: |
          curl -fsSL -o /tmp/duckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          sudo unzip -oq /tmp/duckdb.zip -d /usr/local/bin
          duckdb --version

      # Download IMDb, transform with Malloy, export docs/imdb_*.parquet.
      - name: Build data
        run: bash scripts/build_data.sh

      # Resolve imdb_id -> TMDB poster_path against the freshly built titles.
      # Reads the previous docs/data/poster_paths.parquet (from the checkout)
      # as a cache, so only new/unresolved titles hit the TMDB API.
      #
      # Best-effort: posters are secondary to the data. If the TMDB secret is
      # missing or the API is down, don't discard the whole data refresh --
      # continue-on-error lets the commit step still ship the new parquet.
      # Needs the TMDB_READ_ACCESS_TOKEN repo secret to actually update posters.
      - name: Resolve poster paths
        continue-on-error: true
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: python3 scripts/resolve_posters.py

      - name: Commit refreshed data
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add docs/imdb_titles.parquet \
                  docs/imdb_principals.parquet \
                  docs/imdb_names.parquet \
                  docs/data/poster_paths.parquet
          # Nothing changed means there was nothing new upstream. That is
          # success, not failure.
          git commit -m "refresh data $(date -u +%F)" || exit 0
          git push
