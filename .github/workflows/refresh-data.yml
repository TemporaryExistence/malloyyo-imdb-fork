name: refresh-data

# Weekly rebuild of the site's data so GitHub Pages stays current:
#   download IMDb -> transform with Malloy -> export parquet -> resolve posters
#   -> commit docs/. The dashboards are static HTML that fetch these parquet
#   files client-side, so committing fresh data is all it takes to update the
#   live site -- no re-bundle needed.
#
# History grows ~12 MB/week. That is not part of the weekly recipe; flatten it
# occasionally by hand when it bothers you (see RECIPE.md).

on:
  schedule:
    - cron: "0 6 * * 0"   # weekly, Sunday 06:00 UTC
  workflow_dispatch:       # ...or run on demand from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # FORK ADDITION. A fork does NOT inherit the upstream repo's secrets, and
      # both TMDB steps below are `continue-on-error`, so a fork with no token
      # produces a GREEN run that quietly ships stale posters and stale "where
      # to watch" -- on a site whose whole point is telling you where to watch.
      # Verified 2026-08-05: this repo had ZERO secrets set, and the first
      # scheduled run had not yet landed. So the credential is checked up front
      # and the verdict is carried to a final assert step, which fails the run
      # AFTER the data has still been committed. Loud, without discarding the
      # half of the refresh that needs no credential.
      - name: Check TMDB credential
        id: tmdbcheck
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "${TMDB_READ_ACCESS_TOKEN:-}" ] && [ -z "${TMDB_API_KEY:-}" ]; then
            echo "::error::No TMDB credential. Set the TMDB_READ_ACCESS_TOKEN repo secret (Settings -> Secrets and variables -> Actions). Posters and watch providers will NOT refresh until you do."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -n "${TMDB_READ_ACCESS_TOKEN:-}" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${TMDB_READ_ACCESS_TOKEN}" \
              "https://api.themoviedb.org/3/configuration")
          else
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://api.themoviedb.org/3/configuration?api_key=${TMDB_API_KEY}")
          fi
          # 401 is the credential; anything else non-200 is TMDB's problem, not
          # ours, and must not be reported as a dead key.
          if [ "$code" = "401" ]; then
            echo "::error::TMDB rejected the credential (HTTP 401). Rotate the token and update the repo secret."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::warning::TMDB configuration probe returned HTTP $code -- treating as a transient outage, not a bad key."
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Malloy CLI
        run: npm install -g @malloydata/cli

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DuckDB CLI
        env:
          DUCKDB_VERSION: v1.5.5
        run: |
          curl -fsSL -o /tmp/duckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          sudo unzip -oq /tmp/duckdb.zip -d /usr/local/bin
          duckdb --version

      # Download IMDb, transform with Malloy, export docs/imdb_*.parquet.
      - name: Build data
        run: bash scripts/build_data.sh

      # Resolve imdb_id -> TMDB poster_path against the freshly built titles.
      # Reads the previous docs/data/poster_paths.parquet (from the checkout)
      # as a cache, so only new/unresolved titles hit the TMDB API.
      #
      # Best-effort: posters are secondary to the data. If the TMDB secret is
      # missing or the API is down, don't discard the whole data refresh --
      # continue-on-error lets the commit step still ship the new parquet.
      # Needs the TMDB_READ_ACCESS_TOKEN repo secret to actually update posters.
      - name: Resolve poster paths
        continue-on-error: true
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/resolve_posters.py

      # FORK ADDITION. Taste features are derived from the freshly built titles
      # and principals, so they MUST rebuild in the same run or the recommender
      # scores against a stale title list. Cheap and local -- no API, no secret.
      - name: Rebuild taste features
        run: bash scripts/build_taste_features.sh

      # FORK ADDITION. This is the one that actually rots. A title leaves
      # Netflix with no warning, so a "where to watch" answer that is a month
      # old is worse than none at all on a site whose whole point is telling you
      # where to watch. Best-effort like posters: a TMDB outage must not discard
      # the rest of the refresh.
      # Needs TMDB_READ_ACCESS_TOKEN (v4) or TMDB_API_KEY (v3) as a repo secret.
      - name: Refresh watch providers
        continue-on-error: true
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/fetch_watch_providers.py --regions US

      # FORK ADDITION. The where-to-watch marks are split into four vote bands
      # sized to stay under the runtime's silent 5,000-row truncation. A data
      # refresh moves the distribution those bands were cut from, and the
      # failure is invisible -- posters simply lose their badge. This re-derives
      # the band sizes from the freshly built parquet and fails while there is
      # still headroom. Not continue-on-error: a wrong badge is the product.
      - name: Check availability vote-bands still fit
        run: bash scripts/check_bands.sh

      - name: Commit refreshed data
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add docs/imdb_titles.parquet \
                  docs/imdb_principals.parquet \
                  docs/imdb_names.parquet \
                  docs/data/poster_paths.parquet \
                  docs/data/taste_features.parquet \
                  docs/data/watch_providers.parquet
          # Nothing changed means there was nothing new upstream. That is
          # success, not failure.
          git commit -m "refresh data $(date -u +%F)" || exit 0
          git push

      # FORK ADDITION. Runs LAST, on purpose: the data above is already
      # committed, so a missing or rejected TMDB credential costs the run its
      # green tick without costing the refresh. A silently-skipped provider
      # fetch is the failure mode this exists to make visible.
      - name: Assert the TMDB credential was usable
        if: steps.tmdbcheck.outputs.ok != 'true'
        run: |
          echo "Posters and watch providers did NOT refresh -- see the 'Check TMDB credential' step." >&2
          exit 1
