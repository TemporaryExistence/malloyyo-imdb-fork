name: refresh-posters

on:
  schedule:
    - cron: "0 6 * * 0"   # weekly; posters change rarely
  workflow_dispatch:

jobs:
  posters:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The resolver uses only the Python stdlib for HTTP and shells out to the
      # DuckDB CLI for parquet I/O, so this is the whole dependency list.
      - name: Install DuckDB CLI
        env:
          DUCKDB_VERSION: v1.5.5
        run: |
          curl -fsSL -o /tmp/duckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          sudo unzip -oq /tmp/duckdb.zip -d /usr/local/bin
          duckdb --version

      - name: Resolve poster paths
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          # Only needed if the resolver is switched to --source motherduck;
          # the default reads the tconst list from docs/imdb_titles.parquet.
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: python3 scripts/resolve_posters.py

      - name: Commit refreshed table
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add docs/data/poster_paths.parquet
          # An unchanged parquet means there was nothing new to resolve.
          # That is success, not failure.
          git commit -m "refresh poster paths" || exit 0
          git push
